    function Icon({ name, className = "w-4 h-4" }) {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: spanRef.current });
        }

    function parseFirebaseConfigInput(rawInput) {
      if (!rawInput || !rawInput.trim()) return null;
      const trimmed = rawInput.trim();
      try {
        const parsed = JSON.parse(trimmed);
        if (parsed && parsed.apiKey && parsed.projectId) return parsed;
      } catch (e) {}

      const keys = ['apiKey', 'authDomain', 'databaseURL', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId'];
      const extracted = {};
      keys.forEach(key => {
        const regex = new RegExp(`["']?${key}["']?\\s*:\\s*["']([^"']+)["']`);
        const match = trimmed.match(regex);
        if (match && match[1]) {
          extracted[key] = match[1].trim();
        }
      });

      if (extracted.apiKey && extracted.projectId) {
        return extracted;
      }
      return null;
    }

    function getNextDateForDay(dayOfMonth = 15) {
      const now = new Date();
      let year = now.getFullYear();
      let month = now.getMonth();
      if (now.getDate() > dayOfMonth) {
        month += 1;
        if (month > 11) { month = 0; year += 1; }
      }
      const maxDays = new Date(year, month + 1, 0).getDate();
      return new Date(year, month, Math.min(dayOfMonth, maxDays), 23, 59, 59);
    }

    function getColombiaTimeInfo(utcDateString) {
      const due = new Date(utcDateString);
      const now = new Date();
      const diffMs = due.getTime() - now.getTime();
      const isOverdue = diffMs < 0;
      const absDiff = Math.abs(diffMs);

      const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      const cotFormatted = due.toLocaleString('en-US', {
        timeZone: 'America/Bogota',
        dateStyle: 'medium',
        timeStyle: 'short'
      });

      return { isOverdue, days, hours, formattedCOT: `${cotFormatted} COT` };
    }

    function formatCOP(amount) {
      return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(amount || 0);
    }

    function formatCurrency(amountCOP, currency, rates) {
      const rate = rates[currency] || 1;
      const value = (amountCOP || 0) * rate;
      if (currency === 'COP') return formatCOP(amountCOP);
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency,
        minimumFractionDigits: 0,
        maximumFractionDigits: value < 100 ? 2 : 0
      }).format(value);
    }

    function formatCompactCurrency(amountCOP, currency, rates) {
      const rate = rates[currency] || 1;
      const val = (amountCOP || 0) * rate;
      if (val >= 1000000) return `${(val / 1000000).toFixed(1)}M`;
      if (val >= 1000) return `${(val / 1000).toFixed(0)}k`;
      return `${val.toFixed(0)}`;
    }

    function downloadCSV(csvContent, fileName) {
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function exportCommitmentsToCSV(tasks, fxRates) {
      const headers = [
        'ID', 'Title', 'Pillar Domain', 'Property / Asset', 'SubCategory', 'City Location',
        'Amount COP', 'Amount USD', 'Amount EUR', 'Amount QAR',
        'Due Date (COT)', 'Recurrence Frequency', 'Fixed Day of Month',
        'Priority', 'Status', 'Payment Portal URL', 'Notes'
      ];
      const rows = tasks.map(t => {
        const cop = Number(t.amountCOP) || 0;
        const usd = (cop * (fxRates.USD || 0.00025)).toFixed(2);
        const eur = (cop * (fxRates.EUR || 0.00023)).toFixed(2);
        const qar = (cop * (fxRates.QAR || 0.00091)).toFixed(2);
        const cotDate = t.dueDate ? new Date(t.dueDate).toLocaleString('es-CO', { timeZone: 'America/Bogota' }) : 'N/A';
        return [
          `"${t.id}"`,
          `"${(t.title || '').replace(/"/g, '""')}"`,
          `"${t.domain || ''}"`,
          `"${(t.propertyName || t.location || 'General').replace(/"/g, '""')}"`,
          `"${(t.subCategory || '').replace(/"/g, '""')}"`,
          `"${(t.location || '').replace(/"/g, '""')}"`,
          cop, usd, eur, qar,
          `"${cotDate}"`,
          `"${t.recurrence || 'NONE'}"`,
          t.dueDayOfMonth || 'N/A',
          `"${t.priority || 'MEDIUM'}"`,
          `"${t.status || 'PENDING'}"`,
          `"${t.paymentUrl || ''}"`,
          `"${(t.notes || '').replace(/"/g, '""')}"`
        ].join(',');
      });
      downloadCSV([headers.join(','), ...rows].join('\n'), `Colombia_Commitments_${new Date().toISOString().slice(0, 10)}.csv`);
    }

    function exportPaymentHistoryToCSV(tasks, fxRates) {
      const headers = ['Payment ID', 'Commitment Title', 'Pillar Domain', 'Property / Asset', 'Date Paid (COT)', 'Amount Paid COP', 'Amount Paid USD', 'Reference Notes'];
      const rows = [];
      tasks.forEach(t => {
        (t.paymentHistory || []).forEach(p => {
          const cop = Number(p.amountCOP) || 0;
          const usd = (cop * (fxRates.USD || 0.00025)).toFixed(2);
          const paidDate = p.paidAt ? new Date(p.paidAt).toLocaleString('es-CO', { timeZone: 'America/Bogota' }) : 'N/A';
          rows.push([
            `"${p.id}"`,
            `"${(t.title || '').replace(/"/g, '""')}"`,
            `"${t.domain || ''}"`,
            `"${(t.propertyName || t.location || 'General').replace(/"/g, '""')}"`,
            `"${paidDate}"`,
            cop, usd,
            `"${(p.refNotes || '').replace(/"/g, '""')}"`
          ].join(','));
        });
      });
      downloadCSV([headers.join(','), ...rows].join('\n'), `Colombia_Payment_Ledger_${new Date().toISOString().slice(0, 10)}.csv`);

      const [payingTask, setPayingTask] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [nowTick, setNowTick] = useState(Date.now());

      const appId = 'colombia-commitments-app';

      const showToast = (msg, type = 'info') => {
        setToastMessage({ msg, type });
        setTimeout(() => setToastMessage(null), 3500);
      };

      // --- INITIALIZE FIREBASE ---
      useEffect(() => {
        const connectFirebase = () => {
          const rawConfig = localStorage.getItem('firebase_custom_config');
          if (!rawConfig || !window.FirebaseSDK) {
            setFirebaseStatus('LOCAL');
            return;
          }

          const config = parseFirebaseConfigInput(rawConfig);
          if (!config) {
            setFirebaseStatus('ERROR');
            return;
          }

          try {
            const fb = window.FirebaseSDK;
            const app = fb.getApps().length === 0 ? fb.initializeApp(config) : fb.getApp();
            const auth = fb.getAuth(app);
            const db = fb.getFirestore(app);
            setDbInstance(db);

            fb.signInAnonymously(auth).catch(err => {
              console.error("Anonymous sign-in error:", err);
              setFirebaseStatus('ERROR');
            });

            fb.onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (u) setFirebaseStatus('CONNECTED');
            });
          } catch (err) {
            console.error("Firebase init error:", err);
            setFirebaseStatus('ERROR');
          }
        };

        if (window.FirebaseSDK) {
          connectFirebase();
        } else {
          window.addEventListener('firebase-sdk-ready', connectFirebase);
          return () => window.removeEventListener('firebase-sdk-ready', connectFirebase);
        }
      }, []);

      // --- FIRESTORE REALTIME LISTENER ---
      useEffect(() => {
        if (!user || !dbInstance || !window.FirebaseSDK) return;
        const fb = window.FirebaseSDK;
        const colRef = fb.collection(dbInstance, 'artifacts', appId, 'users', user.uid, 'commitments');

        const unsubscribe = fb.onSnapshot(colRef, (snapshot) => {
          const cloudTasks = [];
          snapshot.forEach((docSnap) => {
            cloudTasks.push({ ...docSnap.data(), id: docSnap.id });
          });
          if (cloudTasks.length > 0) {
            setTasks(cloudTasks);
          } else {
            tasks.forEach(t => {
              fb.setDoc(fb.doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'commitments', t.id), t);
            });
          }
          setFirebaseStatus('CONNECTED');
        }, (error) => {
          console.error("Firestore sync error:", error);
          setFirebaseStatus('ERROR');
        });

        return () => unsubscribe();
      }, [user, dbInstance]);

      const syncTaskToStore = async (taskObj) => {
        if (user && dbInstance && window.FirebaseSDK) {
          try {
            const fb = window.FirebaseSDK;
            await fb.setDoc(fb.doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'commitments', taskObj.id), taskObj);
          } catch (err) {
            console.error("Firestore write error:", err);
          }
        }
      };

      const syncDeleteToStore = async (taskId) => {
        if (user && dbInstance && window.FirebaseSDK) {
          try {
            const fb = window.FirebaseSDK;
            await fb.deleteDoc(fb.doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'commitments', taskId));
          } catch (err) {
            console.error("Firestore delete error:", err);
          }
        }
      };

      useEffect(() => {
        const timer = setInterval(() => setNowTick(Date.now()), 60000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (tasks.length > 0) {
          localStorage.setItem('colombia_tasks_v3', JSON.stringify(tasks));
        }
      }, [tasks]);

      const handleSaveTask = (taskData) => {
        if (editingTask && editingTask.id) {
          const updatedTask = { ...editingTask, ...taskData };
          setTasks(prev => prev.map(t => t.id === editingTask.id ? updatedTask : t));
          syncTaskToStore(updatedTask);
          showToast('Commitment updated!', 'success');
        } else {
          const newTask = {
            ...taskData,
            id: `task-${Date.now()}`,
            status: 'PENDING',
            createdAt: new Date().toISOString(),
            paymentHistory: []
          };
          setTasks(prev => [newTask, ...prev]);
          syncTaskToStore(newTask);
          showToast('Commitment added!', 'success');
        }
        setIsModalOpen(false);
        setEditingTask(null);
      };

      const deleteTaskFromStore = (id) => {
        setTasks(prev => prev.filter(t => t.id !== id));
        syncDeleteToStore(id);
        showToast('Commitment removed', 'info');
      };

      const handleConfirmPayment = ({ actualAmountCOP, refNotes, updateBaseAmount }) => {
        if (!payingTask) return;
        const task = payingTask;
        const isRecurring = task.recurrence && task.recurrence !== 'NONE';
        const now = new Date();

        const newHistoryRecord = {
          id: `pay-${Date.now()}`,
          paidAt: now.toISOString(),
          amountCOP: Number(actualAmountCOP) || task.amountCOP,
          refNotes: refNotes || `Paid on ${now.toLocaleDateString()}`
        };

        const existingHistory = task.paymentHistory || [];

        if (isRecurring) {
          const currentDue = new Date(task.dueDate);
          const recMonths = RECURRENCE_TYPES[task.recurrence]?.months || 1;
          const targetDay = Number(task.dueDayOfMonth) || 15;
          const targetMonth = Number(task.dueMonth !== undefined ? task.dueMonth : currentDue.getMonth());

          let nextYear = currentDue.getFullYear();
          let nextMonth = currentDue.getMonth() + recMonths;

          if (task.recurrence === 'ANNUAL') {
            nextYear = currentDue.getFullYear() + 1;
            nextMonth = targetMonth;
          } else if (nextMonth > 11) {
            nextYear += Math.floor(nextMonth / 12);
            nextMonth = nextMonth % 12;
          }

          const maxDays = new Date(nextYear, nextMonth + 1, 0).getDate();
          const actualDay = Math.min(targetDay, maxDays);
          const nextDueDate = new Date(nextYear, nextMonth, actualDay, 23, 59, 59);

          const updatedTask = {
            ...task,
            amountCOP: updateBaseAmount ? (Number(actualAmountCOP) || task.amountCOP) : task.amountCOP,
            dueDate: nextDueDate.toISOString(),
            status: 'PENDING',
            paymentHistory: [newHistoryRecord, ...existingHistory]
          };

          setTasks(prev => prev.map(t => t.id === task.id ? updatedTask : t));
          syncTaskToStore(updatedTask);
          showToast(`Paid! Next due: ${nextDueDate.toLocaleDateString('es-CO')}`, 'success');
        } else {
          const updatedTask = {
            ...task,
            amountCOP: Number(actualAmountCOP) || task.amountCOP,
            status: 'COMPLETED',
            paymentHistory: [newHistoryRecord, ...existingHistory]
          };
          setTasks(prev => prev.map(t => t.id === task.id ? updatedTask : t));
          syncTaskToStore(updatedTask);
          showToast('Payment logged & completed!', 'success');
        }
        setPayingTask(null);
      };

      const handleLoadPresets = (presetItems) => {
        const newTasks = presetItems.map((item, index) => ({
          ...item,
          id: `preset-${Date.now()}-${index}`,
          dueDate: getNextDateForDay(item.dueDayOfMonth).toISOString(),
          status: 'PENDING',
          createdAt: new Date().toISOString(),
          paymentHistory: []
        }));
        setTasks(prev => [...newTasks, ...prev]);
        newTasks.forEach(t => syncTaskToStore(t));
        setIsPresetsOpen(false);
        showToast(`Loaded ${presetItems.length} commitment rules!`, 'success');
      };

      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          const matchesDomain = selectedDomain === 'ALL' || task.domain === selectedDomain;
          const matchesStatus = selectedStatus === 'ALL'
            ? true
            : selectedStatus === 'COMPLETED'
            ? task.status === 'COMPLETED'
            : task.status !== 'COMPLETED';
          const matchesQuery = !searchQuery ||
            task.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.propertyName || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.location || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.subCategory || '').toLowerCase().includes(searchQuery.toLowerCase());
          return matchesDomain && matchesStatus && matchesQuery;
        });
      }, [tasks, selectedDomain, selectedStatus, searchQuery]);

      const propertyNamesList = useMemo(() => {
        const set = new Set();
        tasks.forEach(t => {
          if (t.propertyName) set.add(t.propertyName);
          else if (t.location) set.add(t.location);
        });
        return Array.from(set);
      }, [tasks]);

      const computeMonthExposure = (targetDate) => {
        const curMonth = targetDate.getMonth();
        const curYear = targetDate.getFullYear();
        const now = new Date();
        const isPastMonth = curYear < now.getFullYear() || (curYear === now.getFullYear() && curMonth < now.getMonth());

        let totalMonthCOP = 0;
        const byPillar = { PROPERTIES: 0, BUSINESSES: 0, COMMITMENTS: 0, FAMILY: 0 };
        const byProperty = {};
        const byCategory = {};
        let itemsCount = 0;

        tasks.forEach(task => {
          const prop = task.propertyName || task.location || 'General Asset';
          const cat = task.subCategory || 'General';

          // 1. Include actual logged payments made in that month
          const historyInMonth = (task.paymentHistory || []).filter(p => {
            if (!p.paidAt) return false;
            const pd = new Date(p.paidAt);
            return pd.getMonth() === curMonth && pd.getFullYear() === curYear;
          });

          if (historyInMonth.length > 0) {
            historyInMonth.forEach(p => {
              const amt = Number(p.amountCOP) || 0;
              totalMonthCOP += amt;
              itemsCount++;
              if (byPillar[task.domain] !== undefined) byPillar[task.domain] += amt;
              byProperty[prop] = (byProperty[prop] || 0) + amt;
              byCategory[cat] = (byCategory[cat] || 0) + amt;
            });
            return;
          }

          // 2. Otherwise evaluate scheduled/projected rules for that month
          if (task.status === 'COMPLETED') {
            if (isPastMonth && task.dueDate) {
              const due = new Date(task.dueDate);
              if (due.getMonth() === curMonth && due.getFullYear() === curYear) {
                const amt = Number(task.amountCOP) || 0;
                totalMonthCOP += amt;
                itemsCount++;
                if (byPillar[task.domain] !== undefined) byPillar[task.domain] += amt;
                byProperty[prop] = (byProperty[prop] || 0) + amt;
                byCategory[cat] = (byCategory[cat] || 0) + amt;
              }
            }
            return;
          }

          const due = new Date(task.dueDate);
          const amount = Number(task.amountCOP) || 0;
          const recMonths = RECURRENCE_TYPES[task.recurrence]?.months || 0;

          let isDue = false;
          if (recMonths === 0) {
            if (due.getMonth() === curMonth && due.getFullYear() === curYear) isDue = true;
          } else {
            let checkYear = due.getFullYear();
            let checkMonth = due.getMonth();
            while (checkYear > curYear || (checkYear === curYear && checkMonth > curMonth)) {
              checkMonth -= recMonths;
              if (checkMonth < 0) {
                checkYear -= Math.ceil(Math.abs(checkMonth) / 12);
                checkMonth = ((checkMonth % 12) + 12) % 12;
              }
            }
            while (checkYear < curYear || (checkYear === curYear && checkMonth <= curMonth)) {
              if (checkYear === curYear && checkMonth === curMonth) { isDue = true; break; }
              checkMonth += recMonths;
              if (checkMonth > 11) {
                checkYear += Math.floor(checkMonth / 12);
                checkMonth = checkMonth % 12;
              }
            }
          }

          if (isDue) {
            totalMonthCOP += amount;
            itemsCount++;
            if (byPillar[task.domain] !== undefined) byPillar[task.domain] += amount;
            byProperty[prop] = (byProperty[prop] || 0) + amount;
            byCategory[cat] = (byCategory[cat] || 0) + amount;
          }
        });

        const topPropertyEntry = Object.entries(byProperty).sort((a, b) => b[1] - a[1])[0];
        const topPillarEntry = Object.entries(byPillar).sort((a, b) => b[1] - a[1])[0];

        return {
          totalMonthCOP,
          byPillar,
          byProperty,
          byCategory,
          itemsCount,
          isPastMonth,
          topProperty: topPropertyEntry ? { name: topPropertyEntry[0], amount: topPropertyEntry[1], pct: totalMonthCOP > 0 ? Math.round((topPropertyEntry[1] / totalMonthCOP) * 100) : 0 } : null,
          topPillar: topPillarEntry && topPillarEntry[1] > 0 ? { label: DOMAINS[topPillarEntry[0]]?.label, amount: topPillarEntry[1], pct: totalMonthCOP > 0 ? Math.round((topPillarEntry[1] / totalMonthCOP) * 100) : 0 } : null,
          monthName: targetDate.toLocaleString('en-US', { month: 'long', year: 'numeric' })
        };
      };

      const currentMonthAnalytics = useMemo(() => {
        return computeMonthExposure(new Date());
      }, [tasks, nowTick]);

      const selectedExposureAnalytics = useMemo(() => {
        return computeMonthExposure(exposureSelectedDate);
      }, [tasks, exposureSelectedDate, nowTick]);

      const projectionDataDetailed = useMemo(() => {
        const monthBuckets = [];
        const now = new Date();

        for (let i = 0; i < 12; i++) {
          const futureDate = new Date(now.getFullYear(), now.getMonth() + i, 1);
          const monthLabel = futureDate.toLocaleString('en-US', { month: 'short' });
          const fullMonthLabel = futureDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
          const targetMonth = futureDate.getMonth();
          const targetYear = futureDate.getFullYear();

          let totalCOP = 0;
          let itemsCount = 0;
          const byPillar = { PROPERTIES: 0, BUSINESSES: 0, COMMITMENTS: 0, FAMILY: 0 };
          const byProperty = {};

          tasks.forEach(task => {
            if (task.status === 'COMPLETED') return;
            const due = new Date(task.dueDate);
            const amount = Number(task.amountCOP) || 0;
            const recMonths = RECURRENCE_TYPES[task.recurrence]?.months || 0;
            const propName = task.propertyName || task.location || 'General';

            let isDue = false;
            if (recMonths === 0) {
              if (due.getMonth() === targetMonth && due.getFullYear() === targetYear) isDue = true;
            } else {
              let checkYear = due.getFullYear();
              let checkMonth = due.getMonth();
              while (checkYear > targetYear || (checkYear === targetYear && checkMonth > targetMonth)) {
                checkMonth -= recMonths;
                if (checkMonth < 0) {
                  checkYear -= Math.ceil(Math.abs(checkMonth) / 12);
                  checkMonth = ((checkMonth % 12) + 12) % 12;
                }
              }
              while (checkYear < targetYear || (checkYear === targetYear && checkMonth <= targetMonth)) {
                if (checkYear === targetYear && checkMonth === targetMonth) { isDue = true; break; }
                checkMonth += recMonths;
                if (checkMonth > 11) {
                  checkYear += Math.floor(checkMonth / 12);
                  checkMonth = checkMonth % 12;
                }
              }
            }

            if (isDue) {
              totalCOP += amount;
              itemsCount++;
              if (byPillar[task.domain] !== undefined) byPillar[task.domain] += amount;
              byProperty[propName] = (byProperty[propName] || 0) + amount;
            }
          });

          monthBuckets.push({
            month: monthLabel,
            fullMonthLabel,
            amountCOP: totalCOP,
            itemsCount,
            byPillar,
            byProperty
          });
        }
        return monthBuckets;
      }, [tasks]);

      const calendarMonthData = useMemo(() => {
        const year = calendarCurrentDate.getFullYear();
        const month = calendarCurrentDate.getMonth();
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDaysInMonth = new Date(year, month + 1, 0).getDate();

        const dayTasksMap = {};
        for (let d = 1; d <= totalDaysInMonth; d++) dayTasksMap[d] = [];

        tasks.forEach(task => {
          const due = new Date(task.dueDate);
          const recMonths = RECURRENCE_TYPES[task.recurrence]?.months || 0;

          if (recMonths === 0) {
            if (due.getFullYear() === year && due.getMonth() === month) {
              const d = due.getDate();
              if (dayTasksMap[d]) dayTasksMap[d].push(task);
            }
          } else {
            const targetDay = Number(task.dueDayOfMonth) || 15;
            const clampedDay = Math.min(targetDay, totalDaysInMonth);
            let isDueInMonth = false;

            if (task.recurrence === 'ANNUAL') {
              const targetMonth = task.dueMonth !== undefined ? task.dueMonth : due.getMonth();
              if (targetMonth === month) isDueInMonth = true;
            } else if (task.recurrence === 'SEMI_ANNUAL') {
              const targetMonth = task.dueMonth !== undefined ? task.dueMonth : due.getMonth();
              if (targetMonth % 6 === month % 6) isDueInMonth = true;
            } else if (task.recurrence === 'QUARTERLY') {
              const targetMonth = task.dueMonth !== undefined ? task.dueMonth : due.getMonth();
              if (targetMonth % 3 === month % 3) isDueInMonth = true;
            } else if (task.recurrence === 'BI_MONTHLY') {
              if (month % 2 === due.getMonth() % 2) isDueInMonth = true;
            } else if (task.recurrence === 'MONTHLY') {
              isDueInMonth = true;
            }

            if (isDueInMonth && dayTasksMap[clampedDay]) {
              dayTasksMap[clampedDay].push(task);
            }
          }
        });

        return {
          year,
          month,
          firstDayIndex,
          totalDaysInMonth,
          dayTasksMap,
          monthName: calendarCurrentDate.toLocaleString('en-US', { month: 'long', year: 'numeric' })
        };
      }, [tasks, calendarCurrentDate]);

      const selectedDayAgendaTasks = calendarMonthData.dayTasksMap[selectedCalendarDay] || [];
      const overdueCount = tasks.filter(t => t.status !== 'COMPLETED' && getColombiaTimeInfo(t.dueDate).isOverdue).length;
      const activeTasksCount = tasks.filter(t => t.status !== 'COMPLETED').length;

      // SVG Donut chart segments for Exposure Tab
      const donutSegments = useMemo(() => {
        const total = selectedExposureAnalytics.totalMonthCOP;
        if (total <= 0) return [];
        const radius = 56;
        const circumference = 2 * Math.PI * radius;
        let accumulatedPct = 0;

        return Object.values(DOMAINS).map(dom => {
          const val = selectedExposureAnalytics.byPillar[dom.id] || 0;
          const pct = val / total;
          const strokeDasharray = `${pct * circumference} ${circumference}`;
          const strokeDashoffset = -accumulatedPct * circumference;
          accumulatedPct += pct;
          return {
            ...dom,
            val,
            pct: Math.round(pct * 100),
            strokeDasharray,
            strokeDashoffset
          };
        }).filter(s => s.val > 0);
      }, [selectedExposureAnalytics]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 ios-main-safe">
          
          {/* NATIVE iOS SAFE-AREA TOP HEADER */}
          <header className="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-xl sticky top-0 z-30 ios-header-safe">
            <div className="max-w-5xl mx-auto px-4 pb-3 flex items-center justify-between gap-2">
              <div className="flex items-center space-x-2.5 min-w-0">
                <div className="w-8 h-8 bg-gradient-to-tr from-amber-500 via-emerald-500 to-blue-600 rounded-xl flex items-center justify-center text-white shadow-md shrink-0">
                  <Icon name="building-2" className="w-4 h-4" />
                </div>
                <div className="min-w-0">
                  <div className="flex items-center space-x-1.5">
                    <h1 className="font-bold text-sm tracking-tight text-white truncate">COLOMBIA TASKS</h1>
                    <span className="text-[9px] px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30 shrink-0">
                      COT
                    </span>
                  </div>
                  <button
                    onClick={() => setIsSettingsOpen(true)}
                    className="flex items-center space-x-1 text-[11px] text-slate-400 hover:text-white transition"
                  >
                    <span className={`w-2 h-2 rounded-full ${
                      firebaseStatus === 'CONNECTED' ? 'bg-emerald-400' :
                      firebaseStatus === 'ERROR' ? 'bg-rose-400' : 'bg-amber-400'
                    }`} />
                    <span className="font-medium">
                      {firebaseStatus === 'CONNECTED' ? 'Cloud Synced' : firebaseStatus === 'ERROR' ? 'Sync Error' : 'Tap to Sync'}
                    </span>
                  </button>
                </div>
              </div>

              {/* CLEAN CURRENCY SWITCHER */}
              <div className="flex items-center bg-slate-800/90 border border-slate-700/60 rounded-xl p-0.5 text-[11px] shrink-0">
                {['USD', 'COP', 'QAR'].map(curr => (
                  <button
                    key={curr}
                    onClick={() => setActiveCurrency(curr)}
                    className={`px-2.5 py-1.5 rounded-lg font-bold transition min-h-[32px] ${
                      activeCurrency === curr ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'
                    }`}
                  >
                    {curr}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed top-20 left-4 right-4 sm:left-auto sm:right-6 z-50 pointer-events-none">
              <div className={`flex items-center space-x-2 px-4 py-3 rounded-2xl shadow-2xl border text-xs font-semibold backdrop-blur-md ${
                toastMessage.type === 'success' ? 'bg-emerald-950/95 border-emerald-500 text-emerald-100' :
                toastMessage.type === 'error' ? 'bg-rose-950/95 border-rose-500 text-rose-100' :
                'bg-slate-900/95 border-slate-700 text-slate-100'
              }`}>
                <Icon name="sparkles" className="w-4 h-4 text-emerald-400" />
                <span>{toastMessage.msg}</span>
              </div>
            </div>
          )}

          {/* MAIN CONTENT CONTAINER */}
          <main className="max-w-5xl mx-auto px-4 pt-4 space-y-4">

            {/* --- TAB 1: DASHBOARD --- */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                {/* 2x2 EXECUTIVE KPI GRID */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                  <div
                    onClick={() => setActiveTab('analytics')}
                    className="bg-slate-900/90 border border-slate-800 active:border-emerald-500/50 p-4 rounded-2xl cursor-pointer transition"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold uppercase text-slate-400 tracking-wider">This Month</span>
                      <Icon name="pie-chart" className="w-3.5 h-3.5 text-emerald-400" />
                    </div>
                    <div className="text-xl sm:text-2xl font-extrabold text-emerald-400 mt-1.5">
                      {formatCurrency(currentMonthAnalytics.totalMonthCOP, activeCurrency, fxRates)}
                    </div>
                    <div className="text-[11px] text-slate-500 mt-0.5">{currentMonthAnalytics.itemsCount} due this cycle</div>
                  </div>

                  <div
                    onClick={() => { setSelectedStatus('ACTIVE'); setActiveTab('commitments'); }}
                    className="bg-slate-900/90 border border-slate-800 active:border-rose-500/50 p-4 rounded-2xl cursor-pointer transition"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Overdue</span>
                      <Icon name="alert-triangle" className="w-3.5 h-3.5 text-rose-400" />
                    </div>
                    <div className={`text-xl sm:text-2xl font-extrabold mt-1.5 ${overdueCount > 0 ? 'text-rose-400' : 'text-slate-200'}`}>
                      {overdueCount}
                    </div>
                    <div className="text-[11px] text-slate-500 mt-0.5">{overdueCount > 0 ? 'Action needed' : 'All on track'}</div>
                  </div>

                  <div
                    onClick={() => setActiveTab('projections')}
                    className="bg-slate-900/90 border border-slate-800 active:border-blue-500/50 p-4 rounded-2xl cursor-pointer transition"
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold uppercase text-slate-400 tracking-wider">12-Mo Run Rate</span>
                      <Icon name="trending-up" className="w-3.5 h-3.5 text-blue-400" />
                    </div>
                    <div className="text-xl sm:text-2xl font-extrabold text-blue-400 mt-1.5">
                      {formatCurrency(
                        Math.round(projectionDataDetailed.reduce((a, b) => a + b.amountCOP, 0) / 12),
                        activeCurrency,
                        fxRates
                      )}
                    </div>
                    <div className="text-[11px] text-slate-500 mt-0.5">Avg monthly outlay</div>
                  </div>

                  <div
                    onClick={() => setActiveTab('calendar')}
                    className="bg-slate-900/90 border border-slate-800 active:border-amber-500/50 p-4 rounded-2xl cursor-pointer transition"
                  >
                    <div className="flex items-center justify-between">

        paymentUrl: task?.paymentUrl || '',
        dueDate: task?.dueDate ? new Date(task.dueDate).toISOString().slice(0, 16) : new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 16),
        recurrence: task?.recurrence || 'NONE',
        dueDayOfMonth: task?.dueDayOfMonth || 15,
        dueMonth: task?.dueMonth !== undefined ? task.dueMonth : new Date().getMonth(),
        priority: task?.priority || 'MEDIUM',

          let targetYear = now.getFullYear();
          let targetMonth = (formData.recurrence === 'ANNUAL' || formData.recurrence === 'SEMI_ANNUAL')
            ? formData.dueMonth
            : now.getMonth();
          const targetDay = formData.dueDayOfMonth || 15;
          const candidate = new Date(targetYear, targetMonth, targetDay, 23, 59, 59);
          if (candidate < now && formData.recurrence === 'ANNUAL') targetYear += 1;
          const maxDays = new Date(targetYear, targetMonth + 1, 0).getDate();
          computedDueDate = new Date(targetYear, targetMonth, Math.min(targetDay, maxDays), 23, 59, 59).toISOString();

              <div>
                <label className="block text-xs font-semibold mb-1 text-slate-300">Notes</label>
                <input type="text" placeholder="NIC, Contract #, reference notes..." value={formData.notes} onChange={e => setFormData({ ...formData, notes: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white" />
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button type="button" onClick={onClose} className="min-h-[44px] px-5 bg-slate-800 text-slate-300 rounded-xl font-bold text-xs">Cancel</button>
                <button type="submit" className="min-h-[44px] px-6 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Save Commitment</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function PayConfirmModal({ task, onClose, onConfirm }) {
      const [actualAmount, setActualAmount] = useState(task.amountCOP || '');
      const [refNotes, setRefNotes] = useState('');
      const [updateBaseAmount, setUpdateBaseAmount] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirm({ actualAmountCOP: Number(actualAmount), refNotes, updateBaseAmount });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-md overflow-hidden shadow-2xl animate-sheet ios-modal-safe">
            <div className="w-10 h-1 bg-slate-700 rounded-full mx-auto mt-2.5 sm:hidden" />
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-white text-base">Confirm Payment</h3>
              <button onClick={onClose} className="w-9 h-9 flex items-center justify-center rounded-full bg-slate-800 text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-sm text-slate-300">
              <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800">
                <div className="font-bold text-white text-sm">{task.title}</div>
                <div className="text-emerald-400 text-xs mt-0.5">{task.propertyName || task.location}</div>
              </div>
              <div>
                <label className="block text-xs font-semibold mb-1 text-slate-300">Actual Amount Paid (COP)</label>
                <input type="number" inputMode="numeric" required value={actualAmount} onChange={e => setActualAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-bold" />
              </div>
              {task.recurrence && task.recurrence !== 'NONE' && (
                <label className="flex items-center space-x-2.5 text-slate-300 text-xs py-1">
                  <input type="checkbox" className="w-4 h-4 rounded" checked={updateBaseAmount} onChange={e => setUpdateBaseAmount(e.target.checked)} />
                  <span>Update future baseline estimate to {formatCOP(actualAmount)}</span>
                </label>
              )}
              <div>
                <label className="block text-xs font-semibold mb-1 text-slate-300">Confirmation / Reference #</label>
                <input type="text" placeholder="PSE #90218..." value={refNotes} onChange={e => setRefNotes(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white" />
              </div>
              <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button type="button" onClick={onClose} className="min-h-[44px] px-5 bg-slate-800 text-slate-300 rounded-xl font-bold text-xs">Cancel</button>
                <button type="submit" className="min-h-[44px] px-6 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">Confirm & Advance</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function PresetsModal({ onClose, onSelectPreset }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl animate-sheet ios-modal-safe">
            <div className="w-10 h-1 bg-slate-700 rounded-full mx-auto mt-2.5 sm:hidden" />
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-white text-base">Colombia Quick Presets</h3>
              <button onClick={onClose} className="w-9 h-9 flex items-center justify-center rounded-full bg-slate-800 text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
            </div>
            <div className="p-4 space-y-4 max-h-[78vh] overflow-y-auto text-xs text-slate-300">
              {PRESET_COLOMBIA_TEMPLATES.map((cat, idx) => (
                <div key={idx} className="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                    <span className="font-bold text-white">{cat.category}</span>
                    <button onClick={() => onSelectPreset(cat.items)} className="min-h-[34px] px-3 bg-emerald-500 text-slate-950 font-bold rounded-xl">
                      Load All ({cat.items.length})
                    </button>
                  </div>
                  {cat.items.map((item, i) => (
                    <div key={i} className="flex items-center justify-between bg-slate-900 p-2.5 rounded-xl">
                      <div>
                        <div className="font-semibold text-white">{item.title}</div>
                        <div className="text-[10px] text-slate-400">Day {item.dueDayOfMonth} • {item.recurrence}</div>
                      </div>
                      <button onClick={() => onSelectPreset([item])} className="min-h-[34px] px-3 bg-emerald-500/15 text-emerald-400 font-bold rounded-xl">
                        + Add
                      </button>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function PaymentHistoryModal({ task, onClose }) {
      const history = task.paymentHistory || [];
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-md overflow-hidden shadow-2xl animate-sheet ios-modal-safe">
            <div className="w-10 h-1 bg-slate-700 rounded-full mx-auto mt-2.5 sm:hidden" />
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-white text-sm truncate pr-2">History: {task.title}</h3>
              <button onClick={onClose} className="w-9 h-9 flex items-center justify-center rounded-full bg-slate-800 text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
            </div>
            <div className="p-4 space-y-2.5 max-h-[65vh] overflow-y-auto text-xs">
              {history.map(r => (
                <div key={r.id} className="p-3.5 bg-slate-950 rounded-2xl border border-slate-800 flex justify-between items-center">
                  <div>
                    <div className="font-bold text-white">{new Date(r.paidAt).toLocaleDateString()}</div>
                    <div className="text-[11px] text-slate-400">{r.refNotes}</div>
                  </div>
                  <div className="font-extrabold text-emerald-400">{formatCOP(r.amountCOP)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function SettingsModal({ config, status, tasks, fxRates, onClose, onSaveConfig }) {
      const [inputConfig, setInputConfig] = useState(() => {
        if (!config) return '';
        try {
          return JSON.stringify(JSON.parse(config), null, 2);
        } catch (e) {
          return config;
        }
      });
      const [parsePreviewError, setParsePreviewError] = useState(null);

      const handleTextChange = (raw) => {
        setInputConfig(raw);
        if (!raw.trim()) {
          setParsePreviewError(null);
          return;
        }
        const parsed = parseFirebaseConfigInput(raw);
        if (parsed) {
          setParsePreviewError(null);
        } else {
          setParsePreviewError('Paste the block containing apiKey and projectId from Firebase Console.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-slate-900 border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-md overflow-hidden shadow-2xl animate-sheet ios-modal-safe">
            <div className="w-10 h-1 bg-slate-700 rounded-full mx-auto mt-2.5 sm:hidden" />
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-white text-base">Cloud Sync & Backups</h3>
              <button onClick={onClose} className="w-9 h-9 flex items-center justify-center rounded-full bg-slate-800 text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
            </div>
            <div className="p-5 space-y-4 text-xs text-slate-300 max-h-[82vh] overflow-y-auto">
              <div className="p-3.5 bg-slate-950 rounded-2xl border border-slate-800 flex items-center justify-between">
                <span className="font-semibold">Sync Status:</span>
                <span className={`font-bold ${status === 'CONNECTED' ? 'text-emerald-400' : status === 'ERROR' ? 'text-rose-400' : 'text-amber-400'}`}>
                  {status === 'CONNECTED' ? '● Firebase Connected' : status === 'ERROR' ? '● Check Rules / Auth' : '● Local Storage Only'}
                </span>
              </div>

              <div>
                <label className="block font-semibold mb-1 text-slate-200">
                  Firebase Config Snippet
                </label>
                <textarea
                  rows={6}
                  placeholder={'const firebaseConfig = {\n  apiKey: "AIzaSy...",\n  authDomain: "...",\n  projectId: "..."\n};'}
                  value={inputConfig}
                  onChange={e => handleTextChange(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-emerald-400 font-mono focus:outline-none focus:border-emerald-500"
                />
                {parsePreviewError ? (
                  <p className="text-[11px] text-amber-400 mt-1">{parsePreviewError}</p>
                ) : inputConfig.trim() ? (
                  <p className="text-[11px] text-emerald-400 mt-1">✓ Valid Firebase credentials detected.</p>
                ) : (
                  <p className="text-[11px] text-slate-400 mt-1">
                    Paste your <code>const firebaseConfig = &#123; ... &#125;;</code> block from Firebase Console.
                  </p>
                )}
              </div>

              <div className="pt-2 border-t border-slate-800 space-y-2">
                <div className="font-bold text-slate-300">CSV Data Exports</div>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={() => exportCommitmentsToCSV(tasks, fxRates)}
                    className="min-h-[42px] px-3 bg-slate-950 border border-slate-800 text-slate-200 rounded-xl font-semibold flex items-center justify-center gap-1.5"
                  >
                    <Icon name="file-spreadsheet" className="w-4 h-4 text-emerald-400" />
                    <span>Commitments</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => exportPaymentHistoryToCSV(tasks, fxRates)}
                    className="min-h-[42px] px-3 bg-slate-950 border border-slate-800 text-slate-200 rounded-xl font-semibold flex items-center justify-center gap-1.5"
                  >
                    <Icon name="history" className="w-4 h-4 text-blue-400" />
                    <span>Payment Log</span>
                  </button>
                </div>
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onClick={onClose} className="min-h-[44px] px-5 bg-slate-800 text-slate-300 rounded-xl font-bold">Close</button>
                <button onClick={() => onSaveConfig(inputConfig)} className="min-h-[44px] px-5 bg-emerald-500 text-slate-950 font-bold rounded-xl">
                  Save & Connect
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
