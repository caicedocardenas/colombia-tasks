        }

    // Safe Firebase Config Parser (handles raw JS snippets, quoted/unquoted keys, URLs, trailing commas)
    function parseFirebaseConfigInput(rawInput) {
      if (!rawInput || !rawInput.trim()) return null;
      const trimmed = rawInput.trim();

      // 1. Try direct JSON.parse first
      try {
        const parsed = JSON.parse(trimmed);
        if (parsed && parsed.apiKey && parsed.projectId) return parsed;
      } catch (e) {}

      // 2. Extract known Firebase keys safely via regex without corrupting URLs
      const keys = ['apiKey', 'authDomain', 'databaseURL', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId'];
      const extracted = {};
      keys.forEach(key => {
        const regex = new RegExp(`["']?${key}["']?\\s*:\\s*["']([^"']+)["']`);
        const match = trimmed.match(regex);
        if (match && match[1]) {
          extracted[key] = match[1].trim();
        }
      });

      if (extracted.apiKey && extracted.projectId) {
        return extracted;
      }

      return null;
    }

    function getNextDateForDay(dayOfMonth = 15) {
      const now = new Date();
      let year = now.getFullYear();
      let month = now.getMonth();
      if (now.getDate() > dayOfMonth) {
        month += 1;
        if (month > 11) { month = 0; year += 1; }
      }
      const maxDays = new Date(year, month + 1, 0).getDate();
      return new Date(year, month, Math.min(dayOfMonth, maxDays), 23, 59, 59);
    }

    function getColombiaTimeInfo(utcDateString) {
      const due = new Date(utcDateString);
      const now = new Date();
      const diffMs = due.getTime() - now.getTime();
      const isOverdue = diffMs < 0;
      const absDiff = Math.abs(diffMs);

      const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((absDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      const cotFormatted = due.toLocaleString('en-US', {
        timeZone: 'America/Bogota',
        dateStyle: 'medium',
        timeStyle: 'short'
      });

      return { isOverdue, days, hours, formattedCOT: `${cotFormatted} COT` };
    }

    function formatCOP(amount) {
      return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(amount || 0);
    }

    function formatCurrency(amountCOP, currency, rates) {
      const rate = rates[currency] || 1;
      const value = (amountCOP || 0) * rate;
      if (currency === 'COP') return formatCOP(amountCOP);
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency,
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value);
    }

    function downloadCSV(csvContent, fileName) {
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function exportCommitmentsToCSV(tasks, fxRates) {
      const headers = [
        'ID', 'Title', 'Pillar Domain', 'Property / Asset', 'SubCategory', 'City Location',
        'Amount COP', 'Amount USD', 'Amount EUR', 'Amount QAR',
        'Due Date (COT)', 'Recurrence Frequency', 'Fixed Day of Month',
        'Priority', 'Status', 'Payment Portal URL', 'Notes'
      ];
      const rows = tasks.map(t => {
        const cop = Number(t.amountCOP) || 0;
        const usd = (cop * (fxRates.USD || 0.00025)).toFixed(2);
        const eur = (cop * (fxRates.EUR || 0.00023)).toFixed(2);
        const qar = (cop * (fxRates.QAR || 0.00091)).toFixed(2);
        const cotDate = t.dueDate ? new Date(t.dueDate).toLocaleString('es-CO', { timeZone: 'America/Bogota' }) : 'N/A';
        return [
          `"${t.id}"`,
          `"${(t.title || '').replace(/"/g, '""')}"`,
          `"${t.domain || ''}"`,
          `"${(t.propertyName || t.location || 'General').replace(/"/g, '""')}"`,
          `"${(t.subCategory || '').replace(/"/g, '""')}"`,
          `"${(t.location || '').replace(/"/g, '""')}"`,
          cop, usd, eur, qar,
          `"${cotDate}"`,
          `"${t.recurrence || 'NONE'}"`,
          t.dueDayOfMonth || 'N/A',
          `"${t.priority || 'MEDIUM'}"`,
          `"${t.status || 'PENDING'}"`,
          `"${t.paymentUrl || ''}"`,
          `"${(t.notes || '').replace(/"/g, '""')}"`
        ].join(',');
      });
      downloadCSV([headers.join(','), ...rows].join('\n'), `Colombia_Commitments_${new Date().toISOString().slice(0, 10)}.csv`);
    }

    function exportPaymentHistoryToCSV(tasks, fxRates) {
      const headers = ['Payment ID', 'Commitment Title', 'Pillar Domain', 'Property / Asset', 'Date Paid (COT)', 'Amount Paid COP', 'Amount Paid USD', 'Reference Notes'];
      const rows = [];
      tasks.forEach(t => {
        (t.paymentHistory || []).forEach(p => {
          const cop = Number(p.amountCOP) || 0;
          const usd = (cop * (fxRates.USD || 0.00025)).toFixed(2);
          const paidDate = p.paidAt ? new Date(p.paidAt).toLocaleString('es-CO', { timeZone: 'America/Bogota' }) : 'N/A';
          rows.push([
            `"${p.id}"`,
            `"${(t.title || '').replace(/"/g, '""')}"`,
            `"${t.domain || ''}"`,
            `"${(t.propertyName || t.location || 'General').replace(/"/g, '""')}"`,
            `"${paidDate}"`,
            cop, usd,
            `"${(p.refNotes || '').replace(/"/g, '""')}"`
          ].join(','));
        });
      });
      downloadCSV([headers.join(','), ...rows].join('\n'), `Colombia_Payment_Ledger_${new Date().toISOString().slice(0, 10)}.csv`);

      const [nowTick, setNowTick] = useState(Date.now());

      const appId = 'colombia-commitments-app';

      const showToast = (msg, type = 'info') => {
        setToastMessage({ msg, type });
        setTimeout(() => setToastMessage(null), 4000);
      };

      // --- INITIALIZE FIREBASE FROM SAVED CONFIG ---
      useEffect(() => {
        const connectFirebase = () => {
          const rawConfig = localStorage.getItem('firebase_custom_config');
          if (!rawConfig || !window.FirebaseSDK) {
            setFirebaseStatus('LOCAL');
            return;
          }

          const config = parseFirebaseConfigInput(rawConfig);
          if (!config) {
            setFirebaseStatus('ERROR');
            return;
          }

          try {
            const fb = window.FirebaseSDK;
            const app = fb.getApps().length === 0 ? fb.initializeApp(config) : fb.getApp();
            const auth = fb.getAuth(app);
            const db = fb.getFirestore(app);
            setDbInstance(db);

            fb.signInAnonymously(auth).catch(err => {
              console.error("Anonymous sign-in error:", err);
              setFirebaseStatus('ERROR');
            });

            fb.onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (u) setFirebaseStatus('CONNECTED');
            });
          } catch (err) {
            console.error("Firebase init error:", err);
            setFirebaseStatus('ERROR');
          }
        };

        if (window.FirebaseSDK) {
          connectFirebase();
        } else {
          window.addEventListener('firebase-sdk-ready', connectFirebase);
          return () => window.removeEventListener('firebase-sdk-ready', connectFirebase);
        }
      }, []);

      // --- FIRESTORE REALTIME LISTENER ---
      useEffect(() => {
        if (!user || !dbInstance || !window.FirebaseSDK) return;
        const fb = window.FirebaseSDK;
        const colRef = fb.collection(dbInstance, 'artifacts', appId, 'users', user.uid, 'commitments');

        const unsubscribe = fb.onSnapshot(colRef, (snapshot) => {
          const cloudTasks = [];
          snapshot.forEach((docSnap) => {
            cloudTasks.push({ ...docSnap.data(), id: docSnap.id });
          });
          if (cloudTasks.length > 0) {
            setTasks(cloudTasks);
          } else {
            tasks.forEach(t => {
              fb.setDoc(fb.doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'commitments', t.id), t);
            });
          }
          setFirebaseStatus('CONNECTED');
        }, (error) => {
          console.error("Firestore sync error:", error);
          setFirebaseStatus('ERROR');
        });

        return () => unsubscribe();
      }, [user, dbInstance]);

      const syncTaskToStore = async (taskObj) => {
        if (user && dbInstance && window.FirebaseSDK) {
          try {
            const fb = window.FirebaseSDK;
            await fb.setDoc(fb.doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'commitments', taskObj.id), taskObj);
          } catch (err) {
            console.error("Firestore write error:", err);
          }
        }
      };

      const syncDeleteToStore = async (taskId) => {
        if (user && dbInstance && window.FirebaseSDK) {
          try {
            const fb = window.FirebaseSDK;
            await fb.deleteDoc(fb.doc(dbInstance, 'artifacts', appId, 'users', user.uid, 'commitments', taskId));
          } catch (err) {
            console.error("Firestore delete error:", err);
          }
        }
      };

      useEffect(() => {
        const timer = setInterval(() => setNowTick(Date.now()), 60000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (tasks.length > 0) {
          localStorage.setItem('colombia_tasks_v3', JSON.stringify(tasks));
        }
      }, [tasks]);

      const handleSaveTask = (taskData) => {
        if (editingTask && editingTask.id) {
          const updatedTask = { ...editingTask, ...taskData };
          setTasks(prev => prev.map(t => t.id === editingTask.id ? updatedTask : t));
          syncTaskToStore(updatedTask);
          showToast('Commitment updated!', 'success');
        } else {
          const newTask = {
            ...taskData,
            id: `task-${Date.now()}`,
            status: 'PENDING',
            createdAt: new Date().toISOString(),
            paymentHistory: []

          syncTaskToStore(newTask);
          showToast('New commitment added!', 'success');

        setIsModalOpen(false);
        setEditingTask(null);

      const deleteTaskFromStore = (id) => {
        setTasks(prev => prev.filter(t => t.id !== id));

        showToast('Commitment removed', 'info');

      const handleConfirmPayment = ({ actualAmountCOP, refNotes, updateBaseAmount }) => {
        if (!payingTask) return;
        const task = payingTask;
        const isRecurring = task.recurrence && task.recurrence !== 'NONE';
        const now = new Date();

        const newHistoryRecord = {
          id: `pay-${Date.now()}`,
          paidAt: now.toISOString(),
          amountCOP: Number(actualAmountCOP) || task.amountCOP,
          refNotes: refNotes || `Paid on ${now.toLocaleDateString()}`
        };

        const existingHistory = task.paymentHistory || [];

        if (isRecurring) {
          const currentDue = new Date(task.dueDate);
          const recMonths = RECURRENCE_TYPES[task.recurrence]?.months || 1;
          const targetDay = Number(task.dueDayOfMonth) || 15;
          const targetMonth = Number(task.dueMonth !== undefined ? task.dueMonth : currentDue.getMonth());

          let nextYear = currentDue.getFullYear();
          let nextMonth = currentDue.getMonth() + recMonths;

          if (task.recurrence === 'ANNUAL') {
            nextYear = currentDue.getFullYear() + 1;
            nextMonth = targetMonth;
          } else if (nextMonth > 11) {
            nextYear += Math.floor(nextMonth / 12);
            nextMonth = nextMonth % 12;
          }

          const maxDays = new Date(nextYear, nextMonth + 1, 0).getDate();
          const actualDay = Math.min(targetDay, maxDays);
          const nextDueDate = new Date(nextYear, nextMonth, actualDay, 23, 59, 59);

          const updatedTask = {
            ...task,
            amountCOP: updateBaseAmount ? (Number(actualAmountCOP) || task.amountCOP) : task.amountCOP,
            dueDate: nextDueDate.toISOString(),
            status: 'PENDING',
            paymentHistory: [newHistoryRecord, ...existingHistory]
          };

          setTasks(prev => prev.map(t => t.id === task.id ? updatedTask : t));
          syncTaskToStore(updatedTask);
          showToast(`Paid! Next due: ${nextDueDate.toLocaleDateString('es-CO')}`, 'success');
        } else {
          const updatedTask = {
            ...task,
            amountCOP: Number(actualAmountCOP) || task.amountCOP,
            status: 'COMPLETED',
            paymentHistory: [newHistoryRecord, ...existingHistory]
          };
          setTasks(prev => prev.map(t => t.id === task.id ? updatedTask : t));
          syncTaskToStore(updatedTask);
          showToast('Payment logged & task completed!', 'success');
        }
        setPayingTask(null);
      };

      const handleLoadPresets = (presetItems) => {
        const newTasks = presetItems.map((item, index) => ({
          ...item,
          id: `preset-${Date.now()}-${index}`,
          dueDate: getNextDateForDay(item.dueDayOfMonth).toISOString(),
          status: 'PENDING',
          createdAt: new Date().toISOString(),
          paymentHistory: []
        }));
        setTasks(prev => [...newTasks, ...prev]);
        newTasks.forEach(t => syncTaskToStore(t));
        setIsPresetsOpen(false);
        showToast(`Loaded ${presetItems.length} commitment rules!`, 'success');
      };

      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          const matchesDomain = selectedDomain === 'ALL' || task.domain === selectedDomain;
          const matchesStatus = selectedStatus === 'ALL'
            ? true
            : selectedStatus === 'COMPLETED'
            ? task.status === 'COMPLETED'
            : task.status !== 'COMPLETED';
          const matchesQuery = !searchQuery ||
            task.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.propertyName || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.location || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.subCategory || '').toLowerCase().includes(searchQuery.toLowerCase());
          return matchesDomain && matchesStatus && matchesQuery;
        });
      }, [tasks, selectedDomain, selectedStatus, searchQuery]);

      const propertyNamesList = useMemo(() => {
        const set = new Set();
        tasks.forEach(t => {
          if (t.propertyName) set.add(t.propertyName);
          else if (t.location) set.add(t.location);
        });
        return Array.from(set);
      }, [tasks]);

      const currentMonthAnalytics = useMemo(() => {
        const now = new Date();
        const curMonth = now.getMonth();
        const curYear = now.getFullYear();

        let totalMonthCOP = 0;
        const byPillar = { PROPERTIES: 0, BUSINESSES: 0, COMMITMENTS: 0, FAMILY: 0 };
        const byProperty = {};
        const byCategory = {};
        let itemsCount = 0;

        tasks.forEach(task => {
          if (task.status === 'COMPLETED') return;
          const due = new Date(task.dueDate);
          const amount = Number(task.amountCOP) || 0;
          const recMonths = RECURRENCE_TYPES[task.recurrence]?.months || 0;

          let isDue = false;
          if (recMonths === 0) {
            if (due.getMonth() === curMonth && due.getFullYear() === curYear) isDue = true;
          } else {
            let checkYear = due.getFullYear();
            let checkMonth = due.getMonth();
            while (checkYear > curYear || (checkYear === curYear && checkMonth > curMonth)) {
              checkMonth -= recMonths;
              if (checkMonth < 0) {
                checkYear -= Math.ceil(Math.abs(checkMonth) / 12);
                checkMonth = ((checkMonth % 12) + 12) % 12;
              }
            }
            while (checkYear < curYear || (checkYear === curYear && checkMonth <= curMonth)) {
              if (checkYear === curYear && checkMonth === curMonth) { isDue = true; break; }
              checkMonth += recMonths;
              if (checkMonth > 11) {
                checkYear += Math.floor(checkMonth / 12);
                checkMonth = checkMonth % 12;
              }
            }
          }

          if (isDue) {
            totalMonthCOP += amount;
            itemsCount++;
            if (byPillar[task.domain] !== undefined) byPillar[task.domain] += amount;
            const prop = task.propertyName || task.location || 'General Asset';
            byProperty[prop] = (byProperty[prop] || 0) + amount;
            const cat = task.subCategory || 'General';
            byCategory[cat] = (byCategory[cat] || 0) + amount;
          }
        });

        return {
          totalMonthCOP,
          byPillar,
          byProperty,
          byCategory,
          itemsCount,
          monthName: now.toLocaleString('en-US', { month: 'long', year: 'numeric' })

      const projectionDataDetailed = useMemo(() => {
        const monthBuckets = [];
        const now = new Date();

        for (let i = 0; i < 12; i++) {
          const futureDate = new Date(now.getFullYear(), now.getMonth() + i, 1);
          const monthLabel = futureDate.toLocaleString('en-US', { month: 'short', year: '2-digit' });
          const targetMonth = futureDate.getMonth();
          const targetYear = futureDate.getFullYear();

          let totalCOP = 0;
          let itemsCount = 0;
          const byPillar = { PROPERTIES: 0, BUSINESSES: 0, COMMITMENTS: 0, FAMILY: 0 };
          const byProperty = {};

          tasks.forEach(task => {
            if (task.status === 'COMPLETED') return;
            const due = new Date(task.dueDate);
            const amount = Number(task.amountCOP) || 0;
            const recMonths = RECURRENCE_TYPES[task.recurrence]?.months || 0;
            const propName = task.propertyName || task.location || 'General';

            let isDue = false;
            if (recMonths === 0) {
              if (due.getMonth() === targetMonth && due.getFullYear() === targetYear) isDue = true;
            } else {
              let checkYear = due.getFullYear();
              let checkMonth = due.getMonth();
              while (checkYear > targetYear || (checkYear === targetYear && checkMonth > targetMonth)) {
                checkMonth -= recMonths;
                if (checkMonth < 0) {
                  checkYear -= Math.ceil(Math.abs(checkMonth) / 12);
                  checkMonth = ((checkMonth % 12) + 12) % 12;
                }
              }
              while (checkYear < targetYear || (checkYear === targetYear && checkMonth <= targetMonth)) {
                if (checkYear === targetYear && checkMonth === targetMonth) { isDue = true; break; }
                checkMonth += recMonths;
                if (checkMonth > 11) {
                  checkYear += Math.floor(checkMonth / 12);
                  checkMonth = checkMonth % 12;
                }
              }
            }

            if (isDue) {
              totalCOP += amount;
              itemsCount++;
              if (byPillar[task.domain] !== undefined) byPillar[task.domain] += amount;
              byProperty[propName] = (byProperty[propName] || 0) + amount;
            }
          });

          monthBuckets.push({
            month: monthLabel,
            amountCOP: totalCOP,
            itemsCount,
            byPillar,
            byProperty
          });
        }
        return monthBuckets;
      }, [tasks]);

      const calendarMonthData = useMemo(() => {
        const year = calendarCurrentDate.getFullYear();
        const month = calendarCurrentDate.getMonth();
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDaysInMonth = new Date(year, month + 1, 0).getDate();

        const dayTasksMap = {};
        for (let d = 1; d <= totalDaysInMonth; d++) dayTasksMap[d] = [];

        tasks.forEach(task => {
          const due = new Date(task.dueDate);
          const recMonths = RECURRENCE_TYPES[task.recurrence]?.months || 0;

          if (recMonths === 0) {
            if (due.getFullYear() === year && due.getMonth() === month) {
              const d = due.getDate();
              if (dayTasksMap[d]) dayTasksMap[d].push(task);
            }
          } else {
            const targetDay = Number(task.dueDayOfMonth) || 15;
            const clampedDay = Math.min(targetDay, totalDaysInMonth);
            let isDueInMonth = false;

            if (task.recurrence === 'ANNUAL') {
              const targetMonth = task.dueMonth !== undefined ? task.dueMonth : due.getMonth();
              if (targetMonth === month) isDueInMonth = true;
            } else if (task.recurrence === 'SEMI_ANNUAL') {
              const targetMonth = task.dueMonth !== undefined ? task.dueMonth : due.getMonth();
              if (targetMonth % 6 === month % 6) isDueInMonth = true;
            } else if (task.recurrence === 'QUARTERLY') {
              const targetMonth = task.dueMonth !== undefined ? task.dueMonth : due.getMonth();
              if (targetMonth % 3 === month % 3) isDueInMonth = true;
            } else if (task.recurrence === 'BI_MONTHLY') {
              if (month % 2 === due.getMonth() % 2) isDueInMonth = true;
            } else if (task.recurrence === 'MONTHLY') {
              isDueInMonth = true;
            }

            if (isDueInMonth && dayTasksMap[clampedDay]) {
              dayTasksMap[clampedDay].push(task);
            }
          }
        });

        return {
          year,
          month,
          firstDayIndex,
          totalDaysInMonth,
          dayTasksMap,
          monthName: calendarCurrentDate.toLocaleString('en-US', { month: 'long', year: 'numeric' })
        };
      }, [tasks, calendarCurrentDate]);

      const selectedDayAgendaTasks = calendarMonthData.dayTasksMap[selectedCalendarDay] || [];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-16">
          
          {/* TOP NAVBAR */}
          <header className="border-b border-slate-800 bg-slate-900/95 backdrop-blur-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="p-2.5 bg-gradient-to-tr from-amber-500 via-emerald-500 to-blue-600 rounded-xl text-white shadow-lg">
                  <Icon name="building-2" className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-bold text-base sm:text-lg tracking-tight text-white">COLOMBIA COMMITMENTS</h1>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-semibold border border-emerald-500/30">
                      COT UTC-5
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400">Properties, Businesses & Family Manager</p>
                </div>
              </div>

              <div className="flex items-center flex-wrap gap-2 justify-between md:justify-end">
                <button
                  onClick={() => setIsPresetsOpen(true)}
                  className="flex items-center space-x-1 px-2.5 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 rounded-xl text-xs font-semibold transition"
                >
                  <Icon name="zap" className="w-3.5 h-3.5" />
                  <span>Presets</span>
                </button>

                <div className="flex items-center bg-slate-800 border border-slate-700/60 rounded-xl p-0.5 text-xs">
                  {['USD', 'COP', 'EUR', 'QAR'].map(curr => (
                    <button
                      key={curr}
                      onClick={() => setActiveCurrency(curr)}
                      className={`px-2 py-1 rounded-lg font-semibold transition ${
                        activeCurrency === curr ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {curr}
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className={`flex items-center space-x-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium border transition ${
                    firebaseStatus === 'CONNECTED'
                      ? 'bg-emerald-950/50 border-emerald-500/40 text-emerald-400'
                      : firebaseStatus === 'ERROR'
                      ? 'bg-rose-950/50 border-rose-500/40 text-rose-400'
                      : 'bg-amber-950/50 border-amber-500/40 text-amber-400'
                  }`}
                >
                  <Icon name="settings" className="w-3.5 h-3.5" />
                  <span>{firebaseStatus === 'CONNECTED' ? 'Cloud Synced' : firebaseStatus === 'ERROR' ? 'Config Error' : 'Cloud Setup'}</span>
                </button>

                <button
                  onClick={() => { setEditingTask(null); setIsModalOpen(true); }}
                  className="flex items-center space-x-1 px-3 py-1.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-bold rounded-xl text-xs shadow-md active:scale-95 transition"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>Add</span>
                </button>
              </div>
            </div>
          </header>

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-5 right-5 left-5 sm:left-auto z-50">
              <div className={`flex items-center space-x-2 px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold ${
                toastMessage.type === 'success' ? 'bg-emerald-900 border-emerald-500 text-emerald-100' :
                toastMessage.type === 'error' ? 'bg-rose-900 border-rose-500 text-rose-100' :
                'bg-slate-800 border-slate-600 text-slate-100'
              }`}>
                <Icon name="sparkles" className="w-4 h-4 text-emerald-400" />
                <span>{toastMessage.msg}</span>
              </div>
            </div>
          )}

          {/* MAIN CONTENT */}
          <main className="max-w-7xl mx-auto px-4 pt-5 space-y-5">

            {/* NAVIGATION TABS */}
            <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2 border-b border-slate-800 pb-3">
              <div className="flex items-center space-x-1.5 overflow-x-auto pb-1 sm:pb-0">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layers' },
                  { id: 'commitments', label: `Tasks (${tasks.filter(t => t.status !== 'COMPLETED').length})`, icon: 'clock' },
                  { id: 'calendar', label: 'Calendar', icon: 'calendar' },
                  { id: 'projections', label: '12-Mo Forecast', icon: 'trending-up' },
                  { id: 'analytics', label: 'Exposure', icon: 'pie-chart' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${
                      activeTab === tab.id
                        ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
                        : 'text-slate-400 hover:text-white hover:bg-slate-900'
                    }`}
                  >
                    <Icon name={tab.icon} className="w-3.5 h-3.5" />
                    <span>{tab.label}</span>

                <button

                    </div>

                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <div className="text-[10px] font-bold uppercase text-slate-400">Active Rules</div>
                    <div className="text-lg sm:text-xl font-bold text-blue-400 mt-1">

                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <div className="text-[10px] font-bold uppercase text-slate-400">Properties & Entities</div>
                    <div className="text-lg sm:text-xl font-bold text-amber-400 mt-1">
                      {propertyNamesList.length}

                {/* PILLAR CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  {Object.values(DOMAINS).map(dom => {

                  <div className="space-y-2.5">
                    {tasks

      const [formData, setFormData] = useState({
        title: task?.title || '',
        domain: task?.domain || 'PROPERTIES',
        propertyName: task?.propertyName || task?.location || 'Cartagena - Palmetto Sunset',
        subCategory: task?.subCategory || 'Maintenance & Repairs',
        location: task?.location || 'Cartagena',
        amountCOP: task?.amountCOP || '',
        paymentUrl: task?.paymentUrl || '',
        dueDate: task?.dueDate ? new Date(task.dueDate).toISOString().slice(0, 16) : new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 16),
        recurrence: task?.recurrence || 'NONE',
        dueDayOfMonth: task?.dueDayOfMonth || 15,
        dueMonth: task?.dueMonth !== undefined ? task.dueMonth : new Date().getMonth(),
        priority: task?.priority || 'MEDIUM',
        notes: task?.notes || ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title) return;
        let computedDueDate = formData.dueDate;

        if (formData.recurrence !== 'NONE') {
          const now = new Date();
          let targetYear = now.getFullYear();
          let targetMonth = (formData.recurrence === 'ANNUAL' || formData.recurrence === 'SEMI_ANNUAL')
            ? formData.dueMonth
            : now.getMonth();
          const targetDay = formData.dueDayOfMonth || 15;
          const candidate = new Date(targetYear, targetMonth, targetDay, 23, 59, 59);
          if (candidate < now && formData.recurrence === 'ANNUAL') targetYear += 1;
          const maxDays = new Date(targetYear, targetMonth + 1, 0).getDate();
          computedDueDate = new Date(targetYear, targetMonth, Math.min(targetDay, maxDays), 23, 59, 59).toISOString();
        } else {
          computedDueDate = new Date(formData.dueDate).toISOString();
        }

        onSave({ ...formData, dueDate: computedDueDate });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-3">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">

                <label className="block font-semibold mb-1 text-slate-200">Commitment Title *</label>
                <input type="text" required placeholder="e.g. Afinia Power, A/C Repair, Predial" value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold mb-1 text-slate-200">Pillar</label>
                  <select value={formData.domain} onChange={e => setFormData({ ...formData, domain: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                    {Object.values(DOMAINS).map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-semibold mb-1 text-slate-200">Property / Asset</label>
                  <input type="text" value={formData.propertyName} onChange={e => setFormData({ ...formData, propertyName: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold mb-1 text-slate-200">Amount (COP)</label>
                  <input type="number" placeholder="520000" value={formData.amountCOP} onChange={e => setFormData({ ...formData, amountCOP: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-bold" />
                </div>
                <div>
                  <label className="block font-semibold mb-1 text-slate-200">Category</label>
                  <input type="text" value={formData.subCategory} onChange={e => setFormData({ ...formData, subCategory: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                </div>
              </div>

              <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2.5">
                <div className="font-bold text-emerald-400">Recurrence & Deadline Anchor</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  <div>
                    <label className="block mb-1 text-slate-300">Frequency</label>
                    <select value={formData.recurrence} onChange={e => setFormData({ ...formData, recurrence: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white">
                      {Object.entries(RECURRENCE_TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                    </select>
                  </div>
                  {formData.recurrence === 'NONE' ? (
                    <div>
                      <label className="block mb-1 text-slate-300">Due Date</label>
                      <input type="datetime-local" value={formData.dueDate} onChange={e => setFormData({ ...formData, dueDate: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-white" />
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-2">
                      {(formData.recurrence === 'ANNUAL' || formData.recurrence === 'SEMI_ANNUAL') && (
                        <div>
                          <label className="block mb-1 text-slate-300">Month</label>
                          <select value={formData.dueMonth} onChange={e => setFormData({ ...formData, dueMonth: Number(e.target.value) })} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
                            {MONTH_NAMES.map((m, idx) => <option key={idx} value={idx}>{m.slice(0, 3)}</option>)}
                          </select>
                        </div>
                      )}
                      <div>
                        <label className="block mb-1 text-slate-300">Day</label>
                        <input type="number" min="1" max="31" value={formData.dueDayOfMonth} onChange={e => setFormData({ ...formData, dueDayOfMonth: Number(e.target.value) })} className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white" />
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div>
                <label className="block font-semibold mb-1 text-slate-200">Payment URL / PSE (Optional)</label>
                <input type="url" placeholder="https://..." value={formData.paymentUrl} onChange={e => setFormData({ ...formData, paymentUrl: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
              </div>

              <div>
                <label className="block font-semibold mb-1 text-slate-200">Notes</label>
                <input type="text" placeholder="NIC, Contract #, reference notes..." value={formData.notes} onChange={e => setFormData({ ...formData, notes: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
              </div>

              <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-semibold">Cancel</button>
                <button type="submit" className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl">Save</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function PayConfirmModal({ task, onClose, onConfirm }) {
      const [actualAmount, setActualAmount] = useState(task.amountCOP || '');
      const [refNotes, setRefNotes] = useState('');
      const [updateBaseAmount, setUpdateBaseAmount] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirm({ actualAmountCOP: Number(actualAmount), refNotes, updateBaseAmount });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-white text-sm">Log Payment & Advance Cycle</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
            </div>
            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs text-slate-300">
              <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                <div className="font-bold text-white text-sm">{task.title}</div>
                <div className="text-emerald-400 mt-0.5">{task.propertyName || task.location}</div>
              </div>
              <div>
                <label className="block font-semibold mb-1 text-slate-200">Actual Amount Paid (COP)</label>
                <input type="number" required value={actualAmount} onChange={e => setActualAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-bold text-base" />
              </div>
              {task.recurrence && task.recurrence !== 'NONE' && (
                <label className="flex items-center space-x-2 text-slate-300">
                  <input type="checkbox" checked={updateBaseAmount} onChange={e => setUpdateBaseAmount(e.target.checked)} />
                  <span>Update future estimate to {formatCOP(actualAmount)}</span>
                </label>
              )}
              <div>
                <label className="block font-semibold mb-1 text-slate-200">Confirmation / Reference #</label>
                <input type="text" placeholder="PSE #90218..." value={refNotes} onChange={e => setRefNotes(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
              </div>
              <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-semibold">Cancel</button>
                <button type="submit" className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl">Confirm Payment</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function PresetsModal({ onClose, onSelectPreset }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-3">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl">
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-white text-sm">Colombia Utility & Tax Presets</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
            </div>
            <div className="p-4 space-y-4 max-h-[75vh] overflow-y-auto text-xs text-slate-300">
              {PRESET_COLOMBIA_TEMPLATES.map((cat, idx) => (
                <div key={idx} className="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                    <span className="font-bold text-white">{cat.category}</span>
                    <button onClick={() => onSelectPreset(cat.items)} className="px-2.5 py-1 bg-emerald-500 text-slate-950 font-bold rounded-lg">
                      Load All ({cat.items.length})
                    </button>
                  </div>
                  {cat.items.map((item, i) => (
                    <div key={i} className="flex items-center justify-between bg-slate-900 p-2 rounded-lg">
                      <div>
                        <div className="font-semibold text-white">{item.title}</div>
                        <div className="text-[10px] text-slate-400">Day {item.dueDayOfMonth} • {item.recurrence}</div>
                      </div>
                      <button onClick={() => onSelectPreset([item])} className="text-emerald-400 font-bold hover:underline">+ Add</button>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function PaymentHistoryModal({ task, onClose }) {
      const history = task.paymentHistory || [];
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-white text-sm">Payment History: {task.title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
            </div>
            <div className="p-4 space-y-2 max-h-[60vh] overflow-y-auto text-xs">
              {history.map(r => (
                <div key={r.id} className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center">
                  <div>
                    <div className="font-bold text-white">{new Date(r.paidAt).toLocaleDateString()}</div>
                    <div className="text-[10px] text-slate-400">{r.refNotes}</div>
                  </div>
                  <div className="font-bold text-emerald-400">{formatCOP(r.amountCOP)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function SettingsModal({ config, status, onClose, onSaveConfig }) {
      const [inputConfig, setInputConfig] = useState(() => {
        if (!config) return '';
        try {
          return JSON.stringify(JSON.parse(config), null, 2);
        } catch (e) {
          return config;
        }
      });
      const [parsePreviewError, setParsePreviewError] = useState(null);

      const handleTextChange = (raw) => {
        setInputConfig(raw);
        if (!raw.trim()) {
          setParsePreviewError(null);
          return;
        }
        const parsed = parseFirebaseConfigInput(raw);
        if (parsed) {
          setParsePreviewError(null);
        } else {
          setParsePreviewError('Paste the block containing apiKey and projectId from Firebase Console.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div className="px-5 py-3.5 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-white text-sm">Firebase Cloud Sync Setup</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
            </div>
            <div className="p-5 space-y-4 text-xs text-slate-300">
              <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between">
                <span>Sync Status:</span>
                <span className={`font-bold ${status === 'CONNECTED' ? 'text-emerald-400' : status === 'ERROR' ? 'text-rose-400' : 'text-amber-400'}`}>
                  {status === 'CONNECTED' ? '● Connected to Firebase Cloud' : status === 'ERROR' ? '● Check Firebase Rules / Auth' : '● Local Device Storage Only'}
                </span>
              </div>
              <div>
                <label className="block font-semibold mb-1 text-slate-200">
                  Paste your Firebase Config (from Firebase Project Settings)
                </label>
                <textarea
                  rows={7}
                  placeholder={'const firebaseConfig = {\n  apiKey: "AIzaSy...",\n  authDomain: "...",\n  projectId: "..."\n};'}
                  value={inputConfig}
                  onChange={e => handleTextChange(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-emerald-400 font-mono text-[11px] focus:outline-none focus:border-emerald-500"
                />
                {parsePreviewError ? (
                  <p className="text-[11px] text-amber-400 mt-1">{parsePreviewError}</p>
                ) : inputConfig.trim() ? (
                  <p className="text-[11px] text-emerald-400 mt-1">✓ Valid Firebase credentials detected.</p>
                ) : (
                  <p className="text-[10px] text-slate-400 mt-1">
                    Paste the entire <code>const firebaseConfig = &#123; ... &#125;;</code> block directly from Firebase Console.
                  </p>
                )}
              </div>
              <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                <button onClick={onClose} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-semibold">Close</button>
                <button onClick={() => onSaveConfig(inputConfig)} className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl">
                  Save & Connect
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
